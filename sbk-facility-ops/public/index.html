<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SBK Facility Ops</title>
  <meta name="theme-color" content="#13294B">
  <meta name="description" content="SBK Real Estate — attendance, bin disposal, DEWA meter readings and security patrol">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SBK Ops">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="card" id="loginForm" autocomplete="on">
      <div class="logo">
        <img src="/icon.svg" alt="">
        <div><h2>SBK Facility Ops</h2><div class="muted small">SBK Real Estate</div></div>
      </div>
      <div class="field"><label for="lu">Username</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="note red" hidden></div>
      <button class="btn block" type="submit">Sign in</button>
    </form>
  </div>

  <div id="shell" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/icon.svg" alt="">
        <div><strong>SBK Facility Ops</strong><span id="who"></span></div>
      </div>
      <div class="clock"><span id="clockTime">--:--</span><small id="clockDate"></small></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>

  <dialog id="photoDlg"><img id="photoImg" alt="Photo"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
